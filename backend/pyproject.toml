[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mordeviel-api"
version = "0.1.0"
description = "Serveur distant de Mordeviel — Legendary"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "websockets>=14,<18", "python-dotenv>=1,<2", "Pillow>=12,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mordeviel_api = ["web/*.html", "web/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

