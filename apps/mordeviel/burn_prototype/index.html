<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test réussi 1 · Combustion centrale</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", sans-serif;
      background: #100d0b;
      color: #f2e6d5;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background:
        radial-gradient(ellipse at 50% 42%, #382014 0, #18110d 43%, #100d0b 76%);
    }

    main {
      width: min(100%, 620px);
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #ffd08a;
      font-size: clamp(20px, 4vw, 29px);
      letter-spacing: .02em;
    }

    .description {
      margin: 9px auto 16px;
      color: #d3c4b2;
      font-size: 14px;
      line-height: 1.5;
    }

    .tests {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 0 0 16px;
      font-size: 13px;
    }

    .tests a { color: #ffd08a; }

    .stage {
      position: relative;
      overflow: hidden;
      width: min(100%, 560px);
      margin: 0 auto;
      border: 1px solid #55351e;
      border-radius: 18px;
      background: #100d0b;
      box-shadow: 0 16px 70px #000b, 0 0 34px #ff6a1914;
    }

    .fire-overlay {
      position: absolute;
      z-index: 1;
      display: none;
      pointer-events: none;
      filter: drop-shadow(0 0 10px #ff5412);
      will-change: left, top, width, height, opacity;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 560 / 720;
    }

    .controls {
      display: grid;
      grid-template-columns: auto minmax(100px, 1fr) auto;
      align-items: center;
      gap: 12px;
      width: min(100%, 560px);
      margin: 14px auto 0;
    }

    button {
      min-width: 102px;
      border: 1px solid #aa642d;
      border-radius: 9px;
      padding: 9px 13px;
      color: #ffe3b4;
      background: linear-gradient(#482919, #2a1b13);
      font: inherit;
      cursor: pointer;
    }

    button:hover { background: #61351d; }

    input[type="range"] {
      width: 100%;
      accent-color: #ff8a24;
    }

    output {
      min-width: 44px;
      color: #d5b997;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .caption {
      min-height: 22px;
      margin: 9px 0 0;
      color: #c9b8a5;
      font-size: 13px;
    }

    .note {
      margin: 10px 0 0;
      color: #827568;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Test réussi 1 · Combustion centrale</h1>
    <p class="description">
      Le GIF animé lèche le haut de la cavité, qui gagne le cadre,
      puis le papier se déchire en lambeaux.
    </p>
    <nav class="tests" aria-label="Tests de combustion">
      <a href="./index.html" aria-current="page">Test réussi 1</a>
      <a href="./test-reussi-2.html">Test 2 · Coins fondants</a>
    </nav>
    <div class="stage">
      <canvas id="burn" width="1120" height="1440"
        aria-label="Aperçu de la carte qui brûle du centre vers les bords"></canvas>
      <img id="fire" class="fire-overlay" src="./fire-65.gif" alt="" aria-hidden="true">
    </div>
    <div class="controls">
      <button id="toggle" type="button">Pause</button>
      <input id="scrub" type="range" min="0" max="1000" value="0"
        aria-label="Position de l’animation">
      <output id="time">0 %</output>
    </div>
    <p class="caption" id="caption" aria-live="polite">Le feu perce le centre…</p>
    <p class="note">Prototype indépendant · aucun fichier du jeu ni configuration de build n’est modifié.</p>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector("#burn");
      const ctx = canvas.getContext("2d");
      const card = new Image();
      card.src = "../assets/cards/sulfuron.png";
      const fire = document.querySelector("#fire");

      const cardRect = { x: 108, y: 38, width: 344, height: 491 };
      const size = { width: 560, height: 720 };
      const offscreen = document.createElement("canvas");
      offscreen.width = cardRect.width * 2;
      offscreen.height = cardRect.height * 2;
      const paper = offscreen.getContext("2d");
      const scrub = document.querySelector("#scrub");
      const toggle = document.querySelector("#toggle");
      const output = document.querySelector("#time");
      const caption = document.querySelector("#caption");
      const duration = 7200;
      let startedAt = performance.now();
      let progress = 0;
      let playing = true;
      let scrubbing = false;
      let previousFrame = 0;
      let shards = [];

      const fract = value => value - Math.floor(value);
      const hash = value => fract(Math.sin(value * 127.1 + 311.7) * 43758.5453);
      const ease = value => {
        const t = Math.max(0, Math.min(1, value));
        return t * t * (3 - 2 * t);
      };

      function makeShards() {
        const columns = 7;
        const rows = 9;
        const nodes = [];
        for (let row = 0; row <= rows; row++) {
          nodes[row] = [];
          for (let column = 0; column <= columns; column++) {
            const edge = row === 0 || row === rows || column === 0 || column === columns;
            nodes[row][column] = {
              x: column / columns * cardRect.width +
                (edge ? 0 : (hash(row * 71 + column * 13) - .5) * 13),
              y: row / rows * cardRect.height +
                (edge ? 0 : (hash(row * 37 + column * 43) - .5) * 15),
              id: row * (columns + 1) + column
            };
          }
        }

        function edgePoints(from, to) {
          const reverse = from.id > to.id;
          const start = reverse ? to : from;
          const end = reverse ? from : to;
          const dx = end.x - start.x;
          const dy = end.y - start.y;
          const length = Math.hypot(dx, dy) || 1;
          const points = [start];
          for (let step = 1; step <= 3; step++) {
            const t = step / 4;
            const tear = (hash(start.id * 503 + end.id * 71 + step * 31) - .5) *
              18 * Math.sin(Math.PI * t);
            points.push({
              x: start.x + dx * t - dy / length * tear,
              y: start.y + dy * t + dx / length * tear
            });
          }
          points.push(end);
          return reverse ? points.reverse() : points;
        }

        shards = [];
        let index = 0;
        for (let row = 0; row < rows; row++) {
          for (let column = 0; column < columns; column++) {
            const corners = [
              nodes[row][column],
              nodes[row][column + 1],
              nodes[row + 1][column + 1],
              nodes[row + 1][column]
            ];
            const points = [];
            for (let side = 0; side < corners.length; side++) {
              points.push(...edgePoints(
                corners[side],
                corners[(side + 1) % corners.length]
              ).slice(0, -1));
            }
            const center = points.reduce(
              (sum, point) => ({
                x: sum.x + point.x / points.length,
                y: sum.y + point.y / points.length
              }),
              { x: 0, y: 0 }
            );
            shards.push({
              points,
              center,
              trigger: .74 + hash(index + 61) * .13,
              direction: (hash(index + 191) - .5) * 1.25,
              spin: (hash(index + 311) - .5) * 1.5,
              index
            });
            index++;
          }
        }
      }

      function drawBackdrop(time) {
        const background = ctx.createLinearGradient(0, 0, 0, size.height);
        background.addColorStop(0, "#21150f");
        background.addColorStop(.58, "#15100c");
        background.addColorStop(1, "#080707");
        ctx.fillStyle = background;
        ctx.fillRect(0, 0, size.width, size.height);

        const glow = ctx.createRadialGradient(280, 290, 4, 280, 290, 350);
        glow.addColorStop(0, `rgba(255, 91, 13, ${.06 + Math.sin(time * 7) * .015})`);
        glow.addColorStop(1, "rgba(255, 91, 13, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, size.width, size.height);

        ctx.strokeStyle = "#b8753b22";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(35, 632);
        ctx.lineTo(525, 632);
        ctx.stroke();
      }

      function edgeDistance(angle) {
        const dx = Math.cos(angle);
        const dy = Math.sin(angle);
        const halfWidth = cardRect.width / 2;
        const halfHeight = cardRect.height / 2;
        const tx = Math.abs(dx) < 1e-5 ? Infinity : halfWidth / Math.abs(dx);
        const ty = Math.abs(dy) < 1e-5 ? Infinity : halfHeight / Math.abs(dy);
        return Math.min(tx, ty);
      }

      function boundaryRadius(angle, amount, time) {
        const edge = edgeDistance(angle);
        const shortest = Math.min(cardRect.width, cardRect.height);
        const circle = shortest * .47 * amount;
        const reach = ease((amount - .58) / .4);
        const expanding = circle * (1 - reach) + edge * amount * reach;
        const roughness =
          Math.sin(angle * 5 + .4) * .48 +
          Math.sin(angle * 11 - 1.2) * .28 +
          Math.sin(angle * 23 + 2.1) * .16 +
          Math.sin(angle * 39 - .8) * .08;
        const flicker = Math.sin(angle * 17 + time * 8) * shortest * .004;
        const jagged = Math.min(shortest * .052, Math.max(shortest * .008, edge * .13));
        return Math.max(0, expanding + roughness * jagged * Math.sqrt(amount) + flicker);
      }

      function burnPath(amount, time) {
        const centerX = cardRect.width / 2;
        const centerY = cardRect.height / 2;
        const path = new Path2D();
        if (amount >= 1) {
          path.rect(0, 0, cardRect.width, cardRect.height);
          return path;
        }
        const steps = 240;
        for (let i = 0; i <= steps; i++) {
          const angle = i / steps * Math.PI * 2;
          const radius = boundaryRadius(angle, amount, time);
          const x = centerX + Math.cos(angle) * radius;
          const y = centerY + Math.sin(angle) * radius;
          if (i === 0) path.moveTo(x, y);
          else path.lineTo(x, y);
        }
        path.closePath();
        return path;
      }

      function drawMaskedCard(amount, time) {
        const width = offscreen.width;
        const height = offscreen.height;
        paper.clearRect(0, 0, width, height);
        paper.save();
        paper.scale(2, 2);
        paper.beginPath();
        paper.roundRect(0, 0, cardRect.width, cardRect.height, 13);
        paper.clip();
        paper.drawImage(card, 0, 0, cardRect.width, cardRect.height);
        paper.globalCompositeOperation = "destination-out";
        paper.fill(burnPath(amount, time));
        paper.restore();
        ctx.drawImage(offscreen, cardRect.x, cardRect.y, cardRect.width, cardRect.height);
      }

      function positionFireAtHoleTop(amount, time, p) {
        if (!fire.complete || !fire.naturalWidth || p < .06 || p >= 1) {
          fire.style.display = "none";
          return;
        }
        const centerX = cardRect.width / 2;
        const centerY = cardRect.height / 2;
        const horizontalRadius = Math.max(
          boundaryRadius(0, amount, time),
          boundaryRadius(Math.PI, amount, time)
        );
        const verticalRadius = Math.max(
          boundaryRadius(Math.PI / 2, amount, time),
          boundaryRadius(Math.PI * 1.5, amount, time)
        );
        const holeWidth = horizontalRadius * 2;
        const holeHeight = verticalRadius * 2;
        const fireWidth = Math.min(
          holeWidth * .78,
          holeHeight * fire.naturalWidth / fire.naturalHeight * .78
        );
        const fireHeight = fireWidth * fire.naturalHeight / fire.naturalWidth;
        const holeTop = centerY - verticalRadius;
        const overlap = holeHeight * .15;

        fire.style.display = "block";
        fire.style.left = `${(cardRect.x + centerX - fireWidth / 2) / size.width * 100}%`;
        fire.style.top = `${(cardRect.y + holeTop + overlap - fireHeight) / size.height * 100}%`;
        fire.style.width = `${fireWidth / size.width * 100}%`;
        fire.style.height = `${fireHeight / size.height * 100}%`;
        fire.style.opacity = String(1 - ease((p - .965) / .035));
      }

      function drawShreddedCard(amount, time, p) {
        if (p >= 1) return;
        for (const shard of shards) {
          const age = Math.max(0, (p - shard.trigger) / (1 - shard.trigger));
          if (age >= 1) continue;

          const fall = (age * .18 + age * age * .92) * cardRect.height;
          const drift = Math.sin(time * 7 + shard.index * 1.7) * age * 18 +
            shard.direction * age * 54;
          const spin = shard.spin * age * age * 1.45;
          const alpha = 1 - age;
          const cx = shard.center.x;
          const cy = shard.center.y;

          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(
            cardRect.x + cx + drift,
            cardRect.y + cy + fall
          );
          ctx.rotate(spin);
          ctx.beginPath();
          shard.points.forEach((point, index) => {
            const x = point.x - cx;
            const y = point.y - cy;
            if (index === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.closePath();
          ctx.clip();
          ctx.drawImage(offscreen, -cx, -cy, cardRect.width, cardRect.height);
          ctx.restore();
        }
      }

      function drawBurnFront(amount, time, p) {
        if (amount < .018 || p > .985) return;
        const centerX = cardRect.width / 2;
        const centerY = cardRect.height / 2;
        const path = burnPath(amount, time);
        const opacity = Math.max(.18, 1 - Math.max(0, p - .7) * 2.8);

        ctx.save();
        ctx.translate(cardRect.x, cardRect.y);
        ctx.shadowColor = "#8b310d";
        ctx.shadowBlur = 5;
        ctx.strokeStyle = `rgba(36, 20, 15, ${.98 * opacity})`;
        ctx.lineWidth = 9;
        ctx.stroke(path);
        ctx.shadowBlur = 0;

        for (let i = 0; i < 30; i++) {
          if (hash(i + 947) < .53) continue;
          const angle = i / 30 * Math.PI * 2 + time * .035;
          const end = angle + .035 + hash(i + 781) * .075;
          ctx.beginPath();
          for (let step = 0; step <= 6; step++) {
            const a = angle + (end - angle) * step / 6;
            const radius = boundaryRadius(a, amount, time);
            const x = centerX + Math.cos(a) * radius;
            const y = centerY + Math.sin(a) * radius;
            if (step === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = `rgba(255, ${105 + Math.round(hash(i + 233) * 75)}, 20, ${.7 * opacity})`;
          ctx.lineWidth = 1.4 + hash(i + 511) * 2.2;
          ctx.shadowColor = "#ff5b0a";
          ctx.shadowBlur = 9;
          ctx.stroke();
        }
        ctx.shadowBlur = 0;

        ctx.restore();
      }

      function drawAsh(amount, time, p) {
        if (p < .06 || p > .98) return;
        const centerX = cardRect.width / 2;
        const centerY = cardRect.height / 2;
        for (let i = 0; i < 34; i++) {
          const seed = i * 37.17;
          const age = fract(time * .62 + hash(i + 8));
          const angle = seed % (Math.PI * 2);
          const radius = boundaryRadius(angle, amount, time);
          const x = cardRect.x + centerX + Math.cos(angle) * radius +
            Math.sin(age * 5 + seed) * 8;
          const y = cardRect.y + centerY + Math.sin(angle) * radius + age * 106;
          const opacity = (1 - age) * Math.sin(Math.PI * p) * .82;
          const w = 2 + hash(i + 72) * 3.2;
          const h = w * (1.1 + hash(i + 94));
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(age * 5 + seed);
          ctx.fillStyle = `rgba(${85 + i % 4 * 13}, ${52 + i % 3 * 9}, ${35 + i % 3 * 5}, ${opacity})`;
          ctx.beginPath();
          ctx.moveTo(-w, -h * .3);
          ctx.lineTo(w * .5, -h);
          ctx.lineTo(w, h * .25);
          ctx.lineTo(-w * .25, h);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }

      function drawProgress(p, now) {
        const time = now / 1000;
        ctx.setTransform(2, 0, 0, 2, 0, 0);
        drawBackdrop(time);
        if (card.complete && card.naturalWidth) {
          const amount = Math.pow(Math.max(0, Math.min(1, (p - .1) / .9)), 1.25);
          drawMaskedCard(amount, time);
          positionFireAtHoleTop(amount, time, p);
          if (p >= .76) drawShreddedCard(amount, time, p);
          drawBurnFront(amount, time, p);
          drawAsh(amount, time, p);
        } else {
          ctx.fillStyle = "#d9c7ad";
          ctx.font = "16px Segoe UI";
          ctx.textAlign = "center";
          ctx.fillText("Chargement de la carte…", size.width / 2, size.height / 2);
        }
        scrub.value = String(Math.round(p * 1000));
        output.value = `${Math.round(p * 100)} %`;
        caption.textContent = p < .2
          ? "Le feu perce le centre…"
          : p < .62
            ? "La cavité irrégulière s’élargit…"
            : p < .82
              ? "Le front brûlant rejoint les bords…"
              : p < .98
                ? "Les lambeaux de carte se détachent et tombent…"
                : "La carte se réduit en cendres.";
      }

      function frame(now) {
        if (playing && !scrubbing) {
          if (now - startedAt >= duration) startedAt = now;
          progress = Math.min(1, (now - startedAt) / duration);
        }
        if (now - previousFrame > 30) {
          drawProgress(progress, now);
          previousFrame = now;
        }
        requestAnimationFrame(frame);
      }

      scrub.addEventListener("input", () => {
        scrubbing = true;
        playing = false;
        toggle.textContent = "Rejouer";
        progress = Number(scrub.value) / 1000;
        drawProgress(progress, performance.now());
      });

      scrub.addEventListener("change", () => {
        scrubbing = false;
        startedAt = performance.now() - progress * duration;
      });

      toggle.addEventListener("click", () => {
        if (playing) {
          playing = false;
          toggle.textContent = "Rejouer";
        } else {
          progress = 0;
          startedAt = performance.now();
          playing = true;
          toggle.textContent = "Pause";
        }
      });

      card.addEventListener("load", () => {
        makeShards();
        drawProgress(progress, performance.now());
      });

      makeShards();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
